# ============================================================
# Security CI Pipeline — OWASP V10, ISO 27001 A.8.29
# Runs on every push/PR: SAST, dependency audit, lint.
# ============================================================

name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Python SAST + Dependency Audit ────────────────────────
  backend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Bandit — Python SAST
        run: |
          bandit -r app/ -c pyproject.toml -f json -o bandit-report.json || true
          bandit -r app/ -c pyproject.toml -ll

      # No "|| true" here. It was hiding 30 advisories across pyjwt,
      # cryptography, starlette, python-multipart and aiosmtplib — the
      # signing library, the encryption library and the web core among them.
      # --require-hashes is a flag, not a switch: the old
      # "--require-hashes=false" made pip-audit exit 2 on its own argument
      # parser every single run. The "|| true" that used to be here meant
      # nobody ever saw it, so this step had never actually audited anything.
      - name: pip-audit — Dependency vulnerabilities
        run: pip-audit --desc

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json
          retention-days: 30

  # ── Frontend Dependency Audit ─────────────────────────────
  frontend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The critical-level run that used to sit here was both redundant with
      # this one and silenced by "|| true".
      - name: npm audit — Check for high+ vulnerabilities
        run: npm audit --audit-level=high --omit=dev

      # eslint was being invoked without ever being installed and with no
      # config file in the repo, so this only ever "passed" because of the
      # "|| true" that used to be here. Errors now fail the job; warnings
      # (exhaustive-deps, set-state-in-effect) stay visible without blocking.
      - name: ESLint
        run: npm run lint
