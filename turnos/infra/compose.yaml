# Desenvolvimento local: docker compose -f infra/compose.yaml up -d
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: turnos
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: turnos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnos"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
