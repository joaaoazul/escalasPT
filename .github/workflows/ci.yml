# ============================================================
# Build and test. The security workflow audits dependencies and
# runs SAST; this one proves the thing actually works.
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: escalas
          POSTGRES_PASSWORD: escalas
          POSTGRES_DB: escalaspt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U escalas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # conftest derives an escalaspt_test database from this URL and creates
      # it on first run; it refuses to touch anything not named *_test.
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://escalas:escalas@localhost:5432/escalaspt
        run: pytest -q

      - name: Migrations apply to an empty database
        env:
          DATABASE_URL: postgresql+asyncpg://escalas:escalas@localhost:5432/escalaspt
          APP_ENV: development
          JWT_SECRET_KEY: ci-only-secret-not-used-outside-this-job-0123456789abcdef
        run: alembic upgrade head

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Production build
        run: npm run build
