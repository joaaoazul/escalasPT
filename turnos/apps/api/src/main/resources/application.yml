spring:
  application:
    name: turnos-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/turnos}
    username: ${DATABASE_USER:turnos}
    password: ${DATABASE_PASSWORD:turnos}
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v3/api-docs

turnos:
  security:
    # Chave HMAC do JWT de acesso (base64, >= 32 bytes). Obrigatória fora de dev.
    jwt-secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS0zMi1ieXRlcy1taW5pbXVtLi4u}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # false só em desenvolvimento http://localhost (os cookies passam a não ter o prefixo __Host-)
    cookie-secure: ${COOKIE_SECURE:true}
    max-failed-logins: 5
    lockout: 15m
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:suporte@turnos.pt}
    # Serviços de push dos browsers (Chrome/Android, Firefox, Safari/iOS, Edge/Windows)
    allowed-hosts: fcm.googleapis.com, push.services.mozilla.com, push.apple.com, notify.windows.com
  # O primeiro registo com este email fica com o papel ADMIN (cria postos e grupos).
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
